author:
  name: Julianna Wagar
  affiliation:
    - 'University of Alberta,'
  metadata:
    bio: >-
      Julianna Wagar (she/her) is a SSHRC-funded second-year PhD student in the
      department of

      English, Film, and Creative Writing at the University of Alberta. Her
      research interests include

      romance novels, women’s pleasure, feminist theory, and research creation.
      Her dissertation focuses on demystifying women's sexual pleasure by
      analyzing six contemporary romance novels, as well as through writing her
      own romance novel, which is entitled Here's My Card. 
