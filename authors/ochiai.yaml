author:
  name: Kanato Ochiai
  affiliation:
    - National Institute for Japanese Language and Linguistics
  metadata:
    bio: >-
      Kanato Ochiai is a researcher at the National Institute for Japanese
      Language and Linguistics. His research is in linguistics, with a
      particular focus on discourse analysis and computer-mediated
      communication. He has worked on Japanese online interaction and digitally
      mediated communication. In this presentation, he will report on the
      construction of social media corpora in Japan, focusing on data
      collection, corpus design, and related methodological issues.
