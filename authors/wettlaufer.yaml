author:
  name: Jörg Wettlaufer
  affiliation:
    - Academy of Sciences and Humanities in Lower Saxony
  orcid: 0000-0003-1957-8059
  metadata:
    bio: >-
      Jörg Wettlaufer studied History, History of Art and Physical Anthropology
      at Ruhr-University Bochum, Christian-Albrecht University Kiel, both
      Germany and Sorbonne University at Paris, France.  From 2016 to 2017 and
      again from 2019 onwards he coordinates Digitization at the Goettingen
      Academy and takes care of Data Curation. Since 2021 he leads the Göttingen
      Digital Academy. He is also in charge of several research projects dealing
      with, e.g., late medieval travel accounts, Travels in the Ottoman Empire,
      Evolutionary History, Digital History and  History of Emotions in Medieval
      Law. His interests are in the application of semantic web technologies to
      humanities projects and the publication and preservation of research data.
