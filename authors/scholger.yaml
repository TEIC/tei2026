author:
  name: Martina Scholger
  affiliation:
    - University of Graz
  orcid: 0000-0003-1438-3236
  metadata:
    bio: >-
      Martina Scholger is a senior scientist at the Department of Digital
      Humanities at the University of Graz. Her research focuses on digital
      scholarly editing, including TEI encoding practices, machine learning
      applications in textual scholarship, and the use of large language models
      for editorial tasks. She has been a member of the Institute for
      Documentology and Scholarly Editing since 2014 and serves on the TEI
      Technical Council since 2016.
