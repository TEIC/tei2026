author:
  name: Øyvind Eide
  affiliation:
    - University of Cologne
  orcid: 0000-0002-7766-6287
  metadata:
    bio: >-
      Øyvind Eide is a professor in Digital Humanities at the University of
      Cologne, where he teaches media computer science and computational
      humanities. His research interests are focused on transformative digital
      intermedia studies as a tool for critical engagement with media
      differences, especially the relationships between texts and maps as media
      of communication. He is also engaged in theoretical studies of modelling
      in the humanities as well as beyond.
