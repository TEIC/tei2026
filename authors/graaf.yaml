  orcid: 0009-0005-6091-0318
  metadata:
    bio: >-
      Kevin Graaf is a computer scientist whose research focuses on text
      encoding, digital typography, and computational methods in
      grapholinguistics, especially as they relate to ancient, minoritized, and
      emerging writing systems. In October 2026, he will be joining the VIEWS
      (Visual Interactions in Early Writing Systems) Project as a Visiting
      Fellow at the University of Cambridge. 
