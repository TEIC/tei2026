author:
  name: Constance Crompton
  affiliation:
    - University of Ottawa
  metadata:
    bio: "Constance Crompton is a white, queer, able-bodied settler and Canada Research Chair in Digital Humanities. They direct the University of Ottawa’s Labo de données en sciences humaines/The Humanities Data Lab, and the research lead on Open Science Infrastructure for Canad(ian)a: Digital Collections of the Future (DCoF). They are a member of several research project teams: Lesbian and Gay Liberation in Canada, Linked Infrastructure for Networked Cultural Scholarship, the Implementing New Knowledge Environments Partnership, the Transgender Media Portal and Nouvelles réflexions sur les éditions critiques en contexte numérique.\_They live and work on unceded Algonquin land."
