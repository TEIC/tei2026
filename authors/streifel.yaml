  metadata:
    bio: >-
      Abigail is a second-year undergraduate studying English and political
      science at SFU. She works as a research assistant at the Centre for
      Scottish Studies, and recently received the Jennifer Prosser Wade and
      Family Award for her work on the Lyon in Mourning digital humanities
      project. She also makes visual art in her free time.
