  metadata:
    bio: >-
      Satoru Nakamura, Ph.D., is an associate professor at the Historiographical
      Institute of the University of Tokyo. His main research interest is
      advancing Digital Humanities by leveraging digital archives and
      international standards such as IIIF, TEI, and LOD.
