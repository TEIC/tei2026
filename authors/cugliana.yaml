  orcid: 0000-0002-6460-2954
  metadata:
    bio: >-
      Elisa Cugliana is a Junior Professor of Digital Humanities and Scholarly
      Editing at the University of Cologne. Her research focuses on the study
      and editing of multimodal sources, especially Cimbrian, an endangered
      Germanic language spoken in some areas of Northern Italy and the „sortes"
      texts (interactive divinatory texts and games used in Antiquity and the
      Middle Ages). From a methodological point of view, she is especially
      interested in formalising and operationalising the editorial workflow. She
      is affiliated to the Institute for Documentology and Editing (IDE) in
      Germany and the THINK research collective, which brings together scholars
      from across Europe and the UK. She is an Associate Editor of DSH: Digital
      Scholarship in the Humanities.
