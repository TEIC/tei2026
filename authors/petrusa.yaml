author:
  name: Kate Petrusa
  affiliation:
    - Burnaby Village Museum
  metadata:
    bio: >-
      Kate Petrusa is the Assistant Curator at the Burnaby Village Museum. She
      manages the Museum's collection and is most excited about improving the
      discoverability of this collection online. She completed an Master of
      Anthropology and an Master of Museum Education at UBC. Kate has worked at
      several Museums around the Lower Mainland as a Curator since 2013.
