author:
  name: Kirsten Vad
  affiliation:
    - Aarhus University
  orcid: 0000-0002-8300-4597
  metadata:
    bio: >-
      Kirsten Vad is a PhD fellow at the Center for Grundtvig Studies at Aarhus
      University and managing editor of the digital scholarly edition
      Grundtvig’s Works. Her research focuses on digital scholarly editions,
      editorial commentary and computational approaches to textual scholarship.
      In her PhD project she examines explanatory commentaries across Nordic
      digital editions and explores how human-in-the-loop and machine-learning
      methods can support annotation, classification and the reuse of editorial
      data.
