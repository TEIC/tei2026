author:
  name: Markus Hallensleben
  affiliation:
    - University of British Columbia
  metadata:
    bio: >-
      Markus Hallensleben is Associate Professor at the Department of Central,
      Eastern and Northern European Studies and Executive Committee Member at
      the Centre for Migration Studies at the University of British Columbia,
      Vancouver, Xwməθkwəy̓əm (Musqueam) territory. His publications range from
      early twentieth-century avant-garde movements and theories of
      performativity to Postmigration: Aesthetics and Interventions (co-ed.
      special issue of Crossings, 2023) and “Relational Ethics in German Studies
      and in the German University Context” (co-ed. Special Issue of Seminar,
      2025).
