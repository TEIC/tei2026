    bio: >-
      Joey Takeda is a Developer in the Digital Humanities Innovation Lab (DHIL)
      at Simon Fraser University Library and a member of the TEI Technical
      Council. He holds a Masters of Library and Information Studies from the
      University of Alberta and a Master of Arts in English Literature from the
      University of British Columbia.
