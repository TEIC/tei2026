author:
  name: Elli Bleeker
  affiliation:
    - Huygens Institute
  metadata:
    bio: >-
      Elli Bleeker is a researcher at the Huygens Institute for Dutch History
      and Culture (KNAW), where she specializes in digital scholarly editing.
      She is a member of the Maatschappij der Nederlandse Letteren, a board
      member of the European Society for Textual Scholarship, coordinator of the
      VIDIT working group, and a member of the TEI Technical Council. She loves
      to investigate how deletions, additions, and revisions in old manuscripts
      provide new insights into the genesis and development of literary texts.
