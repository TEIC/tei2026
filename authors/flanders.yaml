author:
  name: Julia Flanders
  affiliation:
    - Northeastern University
  metadata:
    bio: >-
      Julia Flanders is a professor of the practice at Northeastern University
      where she also directs the Digital Scholarship Group and the Centers for
      Digital Scholarship in the Northeastern University Library. She also
      serves as director for the Women Writers Project, and as editor in chief
      of Digital Humanities Quarterly, an open-access journal of digital
      humanities.
