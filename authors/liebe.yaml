  metadata:
    bio: >-
      Lauren Liebe is an Assistant Teaching Professor of Game Studies at Penn
      State Behrend, where she also directs the Virtual and Augmented Reality
      and Interactive Arts Lab. She is also sometimes engages with her first
      academic home, Restoration Drama. Her ongoing Digital Restoration Drama
      project will be relaunching under Linked Early Modern Drama Online, and
      she also serves as the Linked Open Data specialist for the London Stage
      Database.
