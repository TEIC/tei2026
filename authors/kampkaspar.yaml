  metadata:
    bio: >-
      After a degree in History and English at the University of Heidelberg
      (Germany), Dario went on to work at the Duke Augustus Library
      (Wolfenbüttel, Germany) and the Austrian Academy of Sciences (Vienna,
      Austria) before becoming head of the Centre for Digital Editions at the
      University and State Library in Darmstadt (Germany).
