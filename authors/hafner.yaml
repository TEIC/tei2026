author:
  name: Arnd Hafner
  affiliation:
    - Meiji University
  metadata:
    bio: >-
      Originally from Germany, Arnd Hafner has been living in Japan since 1988.
      During the 1990s, he pursued and completed his Bachelor, Master, and
      Doctor of Laws at the Faculty/School of Law at Kyoto University. After two
      years of study on Chinese paleography at Peking University from 2003
      to-2005, he shifted his research focus to Early Chinese unearthed legal
      literature and administrative documents. His major accomplishment thus far
      has been the edition of an unearthed collection of judicial cases from the
      time of the First Emperor. He first encountered TEI through a
      recommendation from an anonymous reviewer in 2023.
