author:
  name: Mary Erica Zimmer
  affiliation:
    - Massachusetts Institute of Technology
  metadata:
    bio: >-
      Mary Erica Zimmer is a Principal Lecturer in Humanities within the
      Concourse Program at the Massachusetts Institute of Technology (MIT). Her
      research interests include early modern literature and history, book
      history, text encoding, scholarly editing, humanities computing, and
      research-oriented pedagogy. Her work has recently appeared in Scholarly
      Editing and the Bloomsbury collection New Directions in Digital Textual
      Studies (edited by Christopher Ohge and Kristen Schuster), and she is both
      an Associate Editor for the Map of Early Modern London and Technical Lead
      for MIT Global Shakespeares. Currently, she is at work on a book project
      tentatively entitled Data Shapes.
