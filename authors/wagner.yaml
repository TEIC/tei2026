author:
  name: Andreas Wagner
  affiliation:
    - Max Planck Institute for Legal History and Legal Theory
  orcid: 0000-0003-1835-1653
  metadata:
    bio: >-
      Andreas has a PhD in Philosophy and is currently working both as "Digital
      Humanities Coordinator" at Max Planck Institute for Legal History and
      Legal Theory in Frankfurt and as a team member of the project "The School
      of Salamanca" of the Academy of Sciences and Literature" in Mainz, where
      he has been collaborating in establishing a digital edition of 16th and
      17th century theological and juridical treatises.
