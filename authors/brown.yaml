author:
  name: Susan Brown
  affiliation:
    - University of Guelph
  metadata:
    bio: >-
      Susan Brown holds a Canada Research Chair in Collaborative Digital
      Scholarship at the University of Guelph. She researches intersectional
      feminism, literary history, and semantic technologies. A founding director
      of the Orlando Project, she works to advance FAIR humanities data through
      the Collaboratory for Writing and Research on Culture, the Linked Editing
      Academic Framework, and the Linked Infrastructure for Networked Cultural
      Scholarship.
