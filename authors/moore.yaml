  metadata:
    bio: >-
      Alison Moore is a Digital Scholarship and Digital Publishing Librarian at
      Simon Fraser University Library. Ali's areas of expertise include open
      scholarship, responsible research assessment, and researcher online
      presence. Since joining SFU Library in 2015, Ali has held a number of
      roles, most recently as the Acting Head, Learning & Engagement, the
      Digital Scholarship Librarian in the Digital Humanities Innovation Lab,
      and Manager, Knowledge Mobilization.
