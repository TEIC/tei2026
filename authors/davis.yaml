  metadata:
    bio: >-
      Leith Davis is Director of the Research Centre for Scottish Studies and a
      professor in the Department of English at Simon Fraser University. She is
      author of Mediating Cultural Memory in Britain and Ireland (Cambridge
      University Press, 2022) and author and co-editor of seven other books
      exploring the intersections of literature and media history in the long
      eighteenth century. She is also Principal Investigator of the “Lyon in
      Mourning” and "Reconstructing Early Circus" Digital Humanities projects.
