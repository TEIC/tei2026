author:
  name: Rei Mochida
  affiliation:
    - Keio University
  metadata:
    bio: >-
      Rei Mochida is a Research Fellow at the Keio Museum Commons (KeMCo), Keio
      University. She completed her Master’s degree in Literature from Japan
      Women's University in March 2024. She specializes in classical Japanese
      literature and Waka literature, focusing particularly in the structured
      encoding of texts using Digital Humanities approaches.

      Her research publication includes "Digital Environments and Print
      Publications Surrounding Classical Japanese Literature Research: From the
      Perspective of Disseminating and Preserving Research Outcomes," published
      in Waka Poetry Studies, No. 131.
