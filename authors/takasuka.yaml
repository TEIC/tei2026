author:
  name: Moe Takasuka
  affiliation:
    - Keio University
  metadata:
    bio: >-
      Moe Takasuka is a researcher at Keio University, Japan. Her research
      focuses on the digital representation of Japanese early modern illustrated
      books, particularly kibyōshi, using TEI and IIIF technologies. She is
      interested in text-image relationships, digital scholarly editing, and
      East Asian text encoding. Her current work explores methods for
      structurally encoding illustrated narratives to support digital humanities
      research.
