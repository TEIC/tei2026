author:
  name: Nadine Quenouille
  affiliation:
    - Saechsische Akademie der Wissenschaften zu Leipzig
  metadata:
    bio: >-
      Nadine initially studied papyrology, archaeology, and ancient history, and
      earned her PhD in papyrology. As a papyrologist, she worked on projects at
      the Universities of Trier and Leipzig from 2002 to 2018, and then as a
      computer scientist on the “Bach digital” project until 2019. In 2023, she
      earned a Master of Science in Digital Humanities. From 2019 to 2023, she
      worked as an education and project manager in the private sector before
      returning to academia to be a research associate in the field of digital
      humanities in the project "Forschungsportal BACH" at the Saxon Academy of
      Sciences in Leipzig.
