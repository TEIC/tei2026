  metadata:
    bio: >-
      Diane Jakacki is Professor of Practice and Coordinator of DH Research at
      Bucknell University, where she leads the LEAF-Confluence initiative. Her
      volume on "Teaching with Text Encoding", co-edited by Brian Croxall, will
      be published by University of Minnesota Press in early 2027. She proudly
      serves on the TEI Board.
