  metadata:
    bio: >-
      Torsten Roeder works as Digital Humanities Consultant for scholarly
      edition projects and grant applications at the Center for Philology and
      Digitality, University of Würzburg. He previously held interim
      professorships in Digital Humanities at the Universities of Rostock and
      Wuppertal, and worked on numerous DH projects, including at the Leopoldina
      National Academy and the Berlin-Brandenburg Academy of Sciences and
      Humanities. Trained in musicology, Italian studies, and choral conducting,
      he earned his PhD at Würzburg with a thesis on 19th-century music
      criticism. His research focuses on historical periodicals, sustainable
      digital scholarly editions, born digital heritage, and lately especially
      vintage computing.
