author:
  name: Shauna Irani
  affiliation:
    - Simon Fraser University
  metadata:
    bio: >-
      Shauna Judith Irani is a recent graduate of Simon Fraser University, where
      she earned her Master of Arts in English with a specialization in Print
      Culture. She is a Research Assistant on both The Embodied Humanities
      Project and The Lyon in Mourning Project. Shauna is especially drawn to
      the accounts of trauma within the manuscript and has presented on the
      suffering and resilience of marginalized figures, such as Ned Burke, in
      Edinburgh, Guelph, and Montreal. Her research has been published in the
      International Review of Scottish Studies and in Shaping Jacobitism:
      Memory, Culture, Networks from Edinburgh University Press. She has also
      been featured on BBC Radio Scotland
