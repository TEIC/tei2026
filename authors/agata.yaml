  metadata:
    bio: >-
      Mari Agata is a Professor of Library and Information Science at Keio
      University, Japan. She specializes in the history of early European
      printed books, with a particular focus on the Gutenberg Bible, using
      analytical bibliography and digital humanities approaches. Recently, she
      has worked with her Keio colleagues to expand DH education, launching a
      new graduate course on TEI.
