author:
  name: Sarah Connell
  affiliation:
    - Northeastern University
  metadata:
    bio: >-
      Sarah Connell is the Associate Director of the Women Writers Project and
      Associate Director of the NULab for Digital Humanities and Computational
      Social Science at Northeastern University. Her research focuses on text
      encoding and computational text analysis, early women’s writing, and
      pedagogies of digital scholarship. She is the editor of the Women Writers
      in Context scholarly publication series and Co-Director of the Digital
      Integration Teaching Initiative at Northeastern.
