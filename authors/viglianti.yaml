author:
  name: Raffaele Viglianti
  affiliation:
    - University of Maryland
  metadata:
    bio: >-
      Dr. Raffaele (Raff) Viglianti is a Senior Research Software Developer at
      the Maryland Institute for Technology in the Humanities, University of
      Maryland. His research is grounded in digital humanities and textual
      scholarship, where “text” includes musical notation. He researches new and
      efficient practices to model and publish textual sources as innovative and
      sustainable digital scholarly resources. Dr. Viglianti is currently an
      elected member of the Text Encoding Initiative technical council and the
      Technical Editor and Micro-editions Co-editor of the Scholarly Editing
      journal.
