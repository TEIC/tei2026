  metadata:
    bio: >-
      Kaitlyn is a PhD candidate in History at Simon Fraser University, working
      on a sheep-centred history of the Highland Clearances in Scotland, c.
      1700-1900. She has also worked as a research assistant on the TEI Lyon in
      Mourning project at SFU.
