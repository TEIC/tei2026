author:
  name: Michael Lužný
  affiliation:
    - National Library of the Czech Republic
  orcid: 0009-0003-5211-4982
  metadata:
    bio: >-
      Michael Lužný is a medievalist and digital librarian, serving as Content
      and Development Administrator for Manuscriptorium, the digital library of
      medieval and early modern written cultural heritage operated by the
      National Library of the Czech Republic. Currently completing a PhD in
      Medieval Latin Studies at Charles University in Prague, he focuses his
      research on late medieval manuscript culture and the Bohemian reform
      movement.
