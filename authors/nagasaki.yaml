author:
  name: Kiyonori Nagasaki
  affiliation:
    - Keio University
  metadata:
    bio: >-
      Kiyonori is a professor specializing in digital humanities. His research
      focuses on the creation, analysis, and preservation of digital scholarly
      resources, with particular interests in text encoding and the Text
      Encoding Initiative. He has led the development of a digital research
      environment for Buddhist studies, supporting innovative and sustainable
      approaches to textual scholarship. He is also committed to advancing
      international collaboration and shared standards in digital humanities.
