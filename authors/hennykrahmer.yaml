  orcid: 0000-0003-2852-065X
  metadata:
    bio: >-
      Ulrike Henny-Krahmer is Junior Professor for Digital Humanities at the
      University of Rostock in Germany since 2021. Her research focuses on
      Digital Scholarly Editions and Computational Text Analysis, in particular
      of literary texts from the 19th century.
