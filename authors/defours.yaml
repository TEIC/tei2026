  metadata:
    bio: >-
      Alice Defours is a PhD student in Digital Humanities (Communication) at
      the University of Ottawa, and a senior research assistant for the
      Humanities Data Lab. Before joining uOttawa, she graduated from Université
      Lumière Lyon II in History–Archaeology (MA) and in Digital Humanities
      (MS). Besides research, she’s also a teaching professor (ATPUO) in Digital
      Literacy, Digital Cultures and Games Studies/Digital Storytelling at
      uOttawa. She lives in Ottawa as a temporary resident of Canada, and pays
      respect to the Algonquin people, traditional guardians of this land which
      remains unceded. 
